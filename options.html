<!doctype html><html><head><meta charset="utf-8"><title>Jev Tweet Radar</title>
<style>body{font:14px/1.6 -apple-system,"Hiragino Sans","PingFang SC",sans-serif;max-width:560px;margin:32px auto;padding:0 16px;color:#222}label{display:block;margin:14px 0 4px;font-weight:600}input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:8px;border:1px solid #bbb;border-radius:6px;font-size:14px;box-sizing:border-box}button{margin-top:18px;padding:8px 18px;border:0;border-radius:6px;background:#0a6b47;color:#fff;font-size:14px}#msg{margin-left:12px;color:#0a6b47}small{color:#666}#goals label,#tags label{font-weight:400;margin:0}</style></head><body>
<h2>Jev Tweet Radar <select id="lang" style="width:auto;float:right;font-size:13px"></select></h2>
<label data-i18n="apiKey"></label><input id="apiKey" type="password" placeholder="ts_..."><small data-i18n="apiKeyNote"></small>
<label data-i18n="goalLabel"></label>
<div id="goals" style="display:grid;gap:4px"></div>
<textarea id="goalCustom" rows="3" style="margin-top:6px;display:none"></textarea>
<small data-i18n="goalNote"></small>
<label data-i18n="tagsLabel"></label>
<div id="tags" style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px"></div><small data-i18n="tagsNote"></small>
<label data-i18n="threshold"></label><input id="threshold" type="number" min="0" max="1" step="0.05">
<label data-i18n="maxPerMinute"></label><input id="maxPerMinute" type="number" min="1" max="600"><small data-i18n="maxNote"></small>
<label><input id="enabled" type="checkbox"> <span data-i18n="enabled"></span></label>
<button id="save" data-i18n="save"></button><span id="msg"></span>
<p><button id="clear" style="background:#666" data-i18n="clear"></button></p>
<script src="i18n.js"></script><script src="options.js"></script></body></html>
