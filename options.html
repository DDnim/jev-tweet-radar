<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Jev Tweet Radar 設定</title>
<style>body{font:14px/1.6 -apple-system,"Hiragino Sans",sans-serif;max-width:560px;margin:32px auto;padding:0 16px;color:#222}label{display:block;margin:14px 0 4px;font-weight:600}input[type=text],input[type=password],input[type=number],select{width:100%;padding:8px;border:1px solid #bbb;border-radius:6px;font-size:14px}button{margin-top:18px;padding:8px 18px;border:0;border-radius:6px;background:#0a6b47;color:#fff;font-size:14px}#msg{margin-left:12px;color:#0a6b47}small{color:#666}</style></head><body>
<h2>Jev Tweet Radar</h2>
<label>TypeSafe API キー</label><input id="apiKey" type="password" placeholder="ts_..."><small>ブラウザ内（chrome.storage.sync）にのみ保存。投稿本文は api.typesafe.ai へ送信されます。</small>
<label>私の目的（「絡む価値」の基準になります）</label>
<div id="goals" style="display:grid;gap:4px"></div>
<textarea id="goalCustom" rows="3" placeholder="例：日本語で AI の話をする人と知り合いたい。英語の投稿は不要。" style="width:100%;padding:8px;border:1px solid #bbb;border-radius:6px;font-size:14px;margin-top:6px;display:none"></textarea>
<small>目的は state.viewer_goal として Jev に渡され、「絡む価値」の質問文が目的基準に切り替わる。他のタグ（バズる・AI臭 など）は目的に関係なく客観判定。</small>
<label>表示するタグ（絡む価値は常に表示）</label>
<div id="tags" style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px"></div><small>外したタグは Jev に問い合わせない（token も減る）。変更後は新しく表示されたポストから反映。</small>
<label>表示言語</label><select id="lang"><option value="ja">日本語</option><option value="zh">中文</option><option value="en">English</option></select>
<label>タグを強調するしきい値（0–1）</label><input id="threshold" type="number" min="0" max="1" step="0.05">
<label>1 分あたりの最大判定数</label><input id="maxPerMinute" type="number" min="1" max="600"><small>1 判定 ≈ 300 token ≈ $0.00001。120/分でも 1 時間 $0.1 未満。</small>
<label><input id="enabled" type="checkbox"> 有効</label>
<button id="save">保存</button><span id="msg"></span>
<p><button id="clear" style="background:#666">判定キャッシュを消去</button></p>
<script src="options.js"></script></body></html>
